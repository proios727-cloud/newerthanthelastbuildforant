name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v
      - run: python scripts/build_board.py desk.json
      - run: python scripts/build_dashboard.py --out /tmp/dashboard.html
      - run: for f in .claude/skills/product-pain-miner/data/*.json; do python .claude/skills/product-pain-miner/scripts/pain_index.py "$f"; done
