<title>24/7 Agent Hedge Fund</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #0B0D10; --chrome: #0E1115; --surface: #13171C; --raised: #1A1F26;
    --border: #232931; --border-strong: #2E3540;
    --ink: #E7EAEE; --muted: #8C95A3; --dim: #5B6472;
    --green: #5EE39A; --amber: #F0B44C; --red: #F26D5B; --blue: #6AA8FF; --violet: #C58BFF;
    --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  a { color: var(--green); text-decoration: none; } a:hover { color: #8FF0BB; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 24px 40px; }
  header.top { position: sticky; top: 0; z-index: 5; display: flex; flex-direction: row; align-items: center; gap: 14px; height: 52px; margin: 0 -24px; padding: 0 24px; background: var(--chrome); border-bottom: 1px solid var(--border); }
  .logo { width: 24px; height: 24px; border-radius: 6px; background: var(--green); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .name { font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  .session { color: var(--muted); font-family: var(--mono); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session { min-width: 0; }
  @media (max-width: 720px) {
    .wrap { padding: 0 16px 32px; }
    header.top { gap: 8px; margin: 0 -16px; padding: 0 16px; }
    .session { display: none; }
    .name { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .btn.small { padding: 0 8px; }
  }
  .mode { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border); font-family: var(--mono); font-size: 11px; font-weight: 500; }
  .mode .dot { width: 7px; height: 7px; border-radius: 50%; }
  .mode[data-mode="LIVE"] { color: var(--green); } .mode[data-mode="LIVE"] .dot { background: var(--green); box-shadow: 0 0 0 3px rgba(94,227,154,0.18); }
  .mode[data-mode="PAPER"] { color: var(--amber); } .mode[data-mode="PAPER"] .dot { background: var(--amber); box-shadow: 0 0 0 3px rgba(240,180,76,0.18); }
  .mode[data-mode="DEMO"] { color: var(--muted); } .mode[data-mode="DEMO"] .dot { background: var(--muted); }
  .btn { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-strong); background: transparent; color: var(--ink); }
  .btn:hover { background: var(--raised); }
  .btn.primary { background: var(--green); border-color: var(--green); color: var(--bg); font-weight: 600; }
  .btn.small { height: 24px; padding: 0 8px; font-size: 11px; }
  .btn[aria-pressed="true"] { background: var(--raised); border-color: var(--green); }

  .mission { display: flex; flex-direction: column; gap: 4px; padding: 22px 0 18px; }
  .mission h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
  .mission p { margin: 0; color: var(--muted); max-width: 72ch; }

  .grid { display: grid; gap: 16px; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .tile { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; }
  .tile .label { font-size: 12px; color: var(--muted); }
  .tile .value { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; display: flex; align-items: baseline; gap: 8px; }
  .trend { font-size: 11px; display: inline-flex; align-items: center; gap: 3px; }
  .trend.up { color: var(--green); } .trend.down { color: var(--red); } .trend.flat { color: var(--dim); }

  .funnel { margin-top: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .funnel-row { display: flex; flex-direction: row; align-items: stretch; gap: 0; overflow-x: auto; }
  .stage { flex: 1 1 0; min-width: 150px; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-left: 1px solid var(--border); position: relative; }
  .stage:first-child { border-left: 0; padding-left: 0; }
  .stage .count { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; }
  .stage .count.empty { color: var(--dim); }
  .stage .bar { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
  .stage .bar i { display: block; height: 100%; background: var(--green); }
  .stage .seat { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .swatch { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  .main { margin-top: 16px; grid-template-columns: minmax(0, 1.4fr) minmax(320px, 0.9fr) minmax(320px, 0.9fr); align-items: start; }
  @media (max-width: 1100px) { .main { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 720px) { .main { grid-template-columns: 1fr; } }
  .panel-h { height: 44px; display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .panel-h .n { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--dim); font-weight: 400; }

  .seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; padding: 16px; }
  .seat-card { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 6px; background: var(--raised); border: 1px solid var(--border); min-height: 150px; }
  .seat-card .head { display: flex; flex-direction: row; align-items: center; gap: 8px; }
  .seat-card .avatar { width: 22px; height: 22px; border-radius: 5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .seat-card .avatar svg { width: 13px; height: 13px; }
  .seat-card .nm { font-weight: 600; }
  .seat-card .role { font-family: var(--mono); font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .status { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 500; }
  .status svg { width: 10px; height: 10px; }
  .status.live { color: var(--blue); background: rgba(106,168,255,0.12); }
  .status.done { color: var(--green); background: rgba(94,227,154,0.12); }
  .status.waiting { color: var(--amber); background: rgba(240,180,76,0.14); }
  .status.blocked { color: var(--red); background: rgba(242,109,91,0.14); }
  .status.idle { color: var(--muted); background: var(--surface); }
  .seat-card .task { color: var(--muted); font-size: 12px; }
  .seat-card .kv { display: grid; grid-template-columns: 52px 1fr; gap: 4px 8px; font-size: 11px; margin-top: auto; }
  .seat-card .kv b { color: var(--dim); font-weight: 500; }
  .seat-card .kv span { color: var(--ink); }
  .seat-card.pulse .avatar { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } 50% { box-shadow: 0 0 0 4px rgba(94,227,154,0.22); } }
  @media (prefers-reduced-motion: reduce) { .seat-card.pulse .avatar { animation: none; } }

  .list { display: flex; flex-direction: column; }
  .q { display: flex; flex-direction: column; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--raised); }
  .q:last-child { border-bottom: 0; }
  .q .t { display: flex; flex-direction: row; align-items: flex-start; gap: 8px; overflow-wrap: anywhere; }
  .q .t .who { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
  .q .bar { height: 4px; border-radius: 2px; background: var(--raised); overflow: hidden; }
  .q .bar i { display: block; height: 100%; }
  .q.blocker .t { color: var(--red); }
  .watch-row { display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--raised); }
  .watch-row:last-child { border-bottom: 0; }
  .watch-row .l { color: var(--muted); }
  .watch-row .v { margin-left: auto; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .watch-row .d { font-family: var(--mono); font-size: 11px; color: var(--dim); min-width: 48px; text-align: right; }
  .feed { display: flex; flex-direction: column; padding: 6px 0; max-height: 420px; overflow-y: auto; font-family: var(--mono); font-size: 11px; }
  .feed .ln { display: flex; flex-direction: row; gap: 10px; padding: 5px 16px; line-height: 1.5; }
  .feed .ln .t { color: var(--dim); flex-shrink: 0; }
  .feed .ln .a { flex-shrink: 0; min-width: 64px; }
  .feed .ln .m { color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
  .empty { padding: 16px; color: var(--dim); font-size: 12px; }

  .bottom { margin-top: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  @media (max-width: 900px) { .bottom { grid-template-columns: 1fr; } }
  .gate { display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--raised); }
  .gate:last-child { border-bottom: 0; }
  .gate .idx { font-family: var(--mono); font-size: 11px; color: var(--dim); width: 18px; }
  .gate .gs { margin-left: auto; }
  .gate.final { background: var(--chrome); }
  .gate.final .word { font-family: var(--mono); font-weight: 500; color: var(--green); }
  .hand { display: flex; flex-direction: row; flex-wrap: wrap; gap: 4px 10px; padding: 10px 16px; border-bottom: 1px solid var(--raised); font-size: 12px; align-items: center; }
  .hand:last-child { border-bottom: 0; }
  .hand .arrow { color: var(--dim); }
  .hand .meta { flex-basis: 100%; font-family: var(--mono); font-size: 10px; color: var(--dim); }
  .brief { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .brief li { color: var(--muted); }
  .brief ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
  .brief .go { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 11px; color: var(--ink); }

  .drawer { position: fixed; inset: 0; z-index: 20; display: none; background: rgba(5,7,9,0.7); align-items: flex-start; justify-content: center; padding: 60px 16px; }
  .drawer[open] { display: flex; }
  .drawer .box { width: min(760px, 100%); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .drawer textarea { width: 100%; min-height: 320px; background: var(--bg); color: var(--ink); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-family: var(--mono); font-size: 11px; resize: vertical; }
  .drawer .msg { font-family: var(--mono); font-size: 11px; color: var(--red); min-height: 16px; }
  .drawer .row { display: flex; flex-direction: row; gap: 8px; align-items: center; }
  .drawer .row .sp { margin-left: auto; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--border-strong); color: var(--ink); padding: 8px 14px; border-radius: 6px; font-size: 12px; display: none; z-index: 30; }
</style>

<div class="wrap">
  <header class="top">
    <div class="logo"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#0B0D10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h3l2-5 3 10 2-5h2"></path></svg></div>
    <span class="name" id="h-name">Desk</span>
    <span class="session" id="h-session"></span>
    <span class="mode" id="h-mode" data-mode="DEMO"><span class="dot"></span><span id="h-mode-text">DEMO</span></span>
    <span style="margin-left:auto; display:flex; gap:8px;">
      <button class="btn small" id="btn-motion" aria-pressed="false" title="Animate seat status only — never numbers">Demo motion</button>
      <button class="btn small" id="btn-load">Load config</button>
    </span>
  </header>

  <section class="mission">
    <h1 id="m-name">Desk</h1>
    <p id="m-mission"></p>
  </section>

  <section class="grid tiles" id="tiles"></section>

  <section class="card funnel">
    <div style="display:flex; align-items:baseline; gap:10px;">
      <span style="font-weight:600;">Funnel</span>
      <span class="eyebrow" id="funnel-note">counts come from the desk's own records — dashes mean nothing real yet</span>
    </div>
    <div class="funnel-row" id="funnel"></div>
  </section>

  <section class="grid main">
    <div class="card">
      <div class="panel-h">Seats <span class="n" id="seats-n"></span></div>
      <div class="seats" id="seats"></div>
    </div>
    <div style="display:flex; flex-direction:column; gap:16px;">
      <div class="card">
        <div class="panel-h">Queue <span class="n" id="queue-n"></span></div>
        <div class="list" id="queue"></div>
      </div>
      <div class="card">
        <div class="panel-h">Watch</div>
        <div class="list" id="watch"></div>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; gap:16px;">
      <div class="card">
        <div class="panel-h"><span id="co-name">Coordinator</span></div>
        <div class="brief"><ol id="brief"></ol><div class="go" id="go"></div></div>
      </div>
      <div class="card">
        <div class="panel-h">Feed <span class="n" id="feed-n"></span></div>
        <div class="feed" id="feed"></div>
      </div>
    </div>
  </section>

  <section class="grid bottom">
    <div class="card">
      <div class="panel-h">Go-live gates <span class="n" id="gates-n"></span></div>
      <div class="list" id="gates"></div>
    </div>
    <div class="card">
      <div class="panel-h">Handoffs <span class="n" id="hand-n"></span></div>
      <div class="list" id="handoffs"></div>
    </div>
  </section>
</div>

<div class="drawer" id="drawer" role="dialog" aria-label="Load a desk config">
  <div class="box">
    <div class="row"><span style="font-weight:600;">Paste a desk.json</span><span class="eyebrow">re-points this board without republishing</span><button class="btn small sp" id="btn-close">Close</button></div>
    <textarea id="cfg-text" spellcheck="false"></textarea>
    <div class="msg" id="cfg-msg"></div>
    <div class="row">
      <button class="btn small" id="btn-reset">Reset to published config</button>
      <span class="sp"></span>
      <button class="btn primary" id="btn-apply">Apply</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

 "pm", "pct": 20}, {"id": "q4", "title": "Pin the trading universe (equity/ETF list + crypto pairs)", "owner": "quant", "pct": 30}, {"id": "q5", "title": "Encode the risk limits as testable rules", "owner": "risk", "pct": 10}], "watch": [{"label": "SPY (close 2026-09-24)", "value": "767.18", "delta": "−0.08%"}, {"label": "BTC/USD (03:38 UTC)", "value": "84,266.90", "delta": ""}, {"label": "VIX", "value": "—", "delta": ""}, {"label": "US 10Y", "value": "—", "delta": ""}, {"label": "Risk budget used today", "value": "—", "delta": ""}], "feed": [{"t": "03:35", "agent": "pm", "msg": "Desk initialized in PAPER mode: market data is live, no execution connector is wired."}, {"t": "03:38", "agent": "quant", "msg": "Probe: GLOBAL_QUOTE SPY returned price 767.18, prev close 767.81, change −0.0821%, latest trading day 2026-09-24."}, {"t": "03:38", "agent": "quant", "msg": "Probe: CURRENCY_EXCHANGE_RATE BTC→USD returned rate_limit ('1 request per second … free key rate limit (25 requests per day)'). Retry OK: 84266.90 (bid 84263.99 / ask 84267.30)."}, {"t": "03:39", "agent": "pm", "msg": "Blocker filed: the feed quota can't support a 24/7 scan cadence. Quant is limited to a small watchlist until a premium key or a second feed is wired."}], "handoffs": [{"from": "macro", "to": "pm", "key": "regime_label", "timeout": "30m", "on_failure": "PM carries the last regime forward, marked stale, and cuts new-entry size by 50%"}, {"from": "quant", "to": "analyst", "key": "signal_list", "timeout": "15m", "on_failure": "Signals expire and the next scan replaces them"}, {"from": "analyst", "to": "risk", "key": "thesis", "timeout": "30m", "on_failure": "The idea is dropped as 'no thesis'. Nothing reaches risk without one"}, {"from": "risk", "to": "trader", "key": "risk_verdict", "timeout": "10m", "on_failure": "The idea is held. No preview is built without a PASS and a max size"}, {"from": "trader", "to": "human", "key": "order_preview", "timeout": "5m", "on_failure": "The preview goes stale and is re-quoted before asking again"}, {"from": "book", "to": "human", "key": "exit_preview", "timeout": "5m", "on_failure": "A stop-loss exit escalates to PM immediately. Other exits are re-quoted"}, {"from": "reporter", "to": "pm", "key": "session_receipt", "timeout": "30m", "on_failure": "PM posts a minimal receipt: funnel counts and NAV only"}], "gates": [{"title": "Risk limits and drawdown halt written as rules and unit-tested", "status": "open"}, {"title": "Market-data feed supports the scan cadence (premium key or second feed)", "status": "blocked"}, {"title": "Paper ledger marks NAV correctly across equity sessions and the crypto day roll", "status": "open"}, {"title": "30 days of PAPER receipts with no risk-rule breach", "status": "open"}, {"title": "Broker or exchange preview tool returns a real quote", "status": "blocked"}, {"title": "Human replies EXECUTE to the first fresh live preview", "status": "open"}]};
  var COLORS = { green: '#5EE39A', amber: '#F0B44C', red: '#F26D5B', blue: '#6AA8FF', violet: '#C58BFF' };
  var ICONS = {
    router: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2"></circle><path d="M8 2v4M8 10v4M2 8h4M10 8h4"></path></svg>',
    scanner: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg>',
    risk: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2l5 2v4c0 3-2.2 5-5 6-2.8-1-5-3-5-6V4z"></path></svg>',
    entry: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h9M8 4l4 4-4 4"></path></svg>',
    exit: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H4M8 4L4 8l4 4"></path></svg>',
    intel: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12l3-4 3 2 3-5 3 3"></path></svg>',
    reporter: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="2.5" width="10" height="11" rx="1.5"></rect><path d="M6 6h4M6 9h4"></path></svg>',
    custom: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="5"></circle></svg>'
  };
  var STATUS_ICON = {
    live: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 1.5a4.5 4.5 0 1 1-4.2 2.9"></path><path d="M1.5 1.5v3h3"></path></svg>',
    done: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.5 2.5 4.5-5"></path></svg>',
    waiting: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="6" r="4.5"></circle><path d="M6 3.5V6l1.8 1.2"></path></svg>',
    blocked: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"></path></svg>',
    idle: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h6"></path></svg>'
  };
  var TREND = { up: '<svg width="8" height="8" viewBox="0 0 8 8" fill="currentColor"><path d="M4 1l3.5 6h-7z"></path></svg>', down: '<svg width="8" height="8" viewBox="0 0 8 8" fill="currentColor"><path d="M4 7L.5 1h7z"></path></svg>', flat: '<svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 4h6"></path></svg>' };
  var STATUS_LABEL = { live: 'Running', done: 'Done', waiting: 'Waiting', blocked: 'Blocked', idle: 'Idle' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function $(id) { return document.getElementById(id); }
  function seatMap(cfg) { var m = {}; (cfg.seats || []).forEach(function (s) { m[s.id] = s; }); return m; }
  function seatChip(s) { if (!s) return '<span class="who">human</span>'; return '<span class="who" style="color:' + COLORS[s.color] + '">' + esc(s.name) + '</span>'; }

  function validate(cfg) {
    var p = [];
    if (!cfg || typeof cfg !== 'object') return ['config must be an object'];
    ['name', 'mission', 'session', 'mode'].forEach(function (k) { if (typeof cfg[k] !== 'string') p.push('missing ' + k); });
    if (['DEMO', 'PAPER', 'LIVE'].indexOf(cfg.mode) < 0) p.push('mode must be DEMO | PAPER | LIVE');
    if (!Array.isArray(cfg.seats) || !cfg.seats.length) p.push('seats must be a non-empty list');
    var ids = {};
    (cfg.seats || []).forEach(function (s, i) {
      if (!s.id || ids[s.id]) p.push('seats[' + i + '] needs a unique id'); ids[s.id] = 1;
      if (!COLORS[s.color]) p.push('seats[' + i + '] color must be green|amber|red|blue|violet');
      if (!STATUS_ICON[s.status]) p.push('seats[' + i + '] status must be idle|live|waiting|blocked|done');
      if (!ICONS[s.role]) p.push('seats[' + i + '] role unknown');
    });
    var routers = (cfg.seats || []).filter(function (s) { return s.role === 'router'; }).length;
    if (routers !== 1) p.push('exactly one router seat required');
    (cfg.queue || []).forEach(function (q, i) { if (q.owner && !ids[q.owner]) p.push('queue[' + i + '] owner is not a seat'); });
    (cfg.feed || []).forEach(function (f, i) { if (f.agent && !ids[f.agent]) p.push('feed[' + i + '] agent is not a seat'); });
    if (!cfg.coordinator || !Array.isArray(cfg.coordinator.brief)) p.push('coordinator.brief required');
    return p;
  }

  function render(cfg) {
    var seats = seatMap(cfg);
    document.title = cfg.name;
    $('h-name').textContent = cfg.name; $('m-name').textContent = cfg.name;
    $('h-session').textContent = cfg.session; $('m-mission').textContent = cfg.mission;
    $('h-mode').setAttribute('data-mode', cfg.mode); $('h-mode-text').textContent = cfg.mode;

    $('tiles').innerHTML = (cfg.tiles || []).map(function (t) {
      var tr = t.trend || 'flat';
      return '<div class="card tile"><span class="label">' + esc(t.label) + '</span><span class="value">' + esc(t.value) + '<span class="trend ' + tr + '">' + TREND[tr] + '</span></span></div>';
    }).join('');

    var f = cfg.funnel || [];
    var max = Math.max.apply(null, f.map(function (x) { return typeof x.count === 'number' ? x.count : 0; }).concat([1]));
    $('funnel').innerHTML = f.length ? f.map(function (x) {
      var has = typeof x.count === 'number'; var s = seats[x.seat];
      return '<div class="stage"><span class="eyebrow">' + esc(x.stage) + '</span><span class="count' + (has ? '' : ' empty') + '">' + (has ? esc(x.count) : '—') + '</span><div class="bar"><i style="width:' + (has ? Math.round(x.count / max * 100) : 0) + '%"></i></div>' + (s ? '<span class="seat"><span class="swatch" style="background:' + COLORS[s.color] + '"></span>' + esc(s.name) + '</span>' : '') + '</div>';
    }).join('') : '<div class="empty">No funnel stages defined.</div>';

    $('seats-n').textContent = (cfg.seats || []).length + ' seats';
    $('seats').innerHTML = (cfg.seats || []).map(function (s) {
      var c = COLORS[s.color];
      return '<div class="seat-card" data-status="' + s.status + '"><div class="head"><span class="avatar" style="background:' + c + '22;color:' + c + '">' + ICONS[s.role] + '</span><span><div class="nm">' + esc(s.name) + '</div><div class="role">' + esc(s.role) + '</div></span><span class="status ' + s.status + '">' + STATUS_ICON[s.status] + esc(STATUS_LABEL[s.status]) + '</span></div><div class="task">' + esc(s.task) + '</div><div class="kv"><b>Done when</b><span>' + esc(s.done) + '</span><b>Trigger</b><span>' + esc(s.trigger) + '</span></div></div>';
    }).join('');

    var q = cfg.queue || [];
    $('queue-n').textContent = q.length + ' open';
    $('queue').innerHTML = q.length ? q.map(function (it) {
      var s = seats[it.owner]; var blk = /^blocker/i.test(it.title);
      return '<div class="q' + (blk ? ' blocker' : '') + '"><div class="t"><span>' + esc(it.title) + '</span>' + seatChip(s) + '</div><div class="bar"><i style="width:' + (it.pct || 0) + '%;background:' + (s ? COLORS[s.color] : '#8C95A3') + '"></i></div></div>';
    }).join('') : '<div class="empty">Queue is clear.</div>';

    $('watch').innerHTML = (cfg.watch || []).length ? cfg.watch.map(function (w) {
      return '<div class="watch-row"><span class="l">' + esc(w.label) + '</span><span class="v">' + esc(w.value) + '</span><span class="d">' + esc(w.delta || '') + '</span></div>';
    }).join('') : '<div class="empty">Nothing on watch.</div>';

    var co = cfg.coordinator || {};
    $('co-name').textContent = co.name || 'Coordinator';
    $('brief').innerHTML = (co.brief || []).map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('');
    $('go').textContent = co.go_line || '';

    var feed = (cfg.feed || []).slice().reverse();
    $('feed-n').textContent = feed.length + ' events';
    $('feed').innerHTML = feed.length ? feed.map(function (e) {
      var s = seats[e.agent];
      return '<div class="ln"><span class="t">' + esc(e.t) + '</span><span class="a" style="color:' + (s ? COLORS[s.color] : '#8C95A3') + '">' + esc(s ? s.name : e.agent) + '</span><span class="m">' + esc(e.msg) + '</span></div>';
    }).join('') : '<div class="empty">No events yet.</div>';

    var g = cfg.gates || [];
    $('gates-n').textContent = g.filter(function (x) { return x.status === 'passed'; }).length + ' / ' + g.length + ' passed';
    $('gates').innerHTML = g.length ? g.map(function (x, i) {
      var st = x.status || 'open'; var cls = st === 'passed' ? 'done' : st === 'blocked' ? 'blocked' : 'waiting';
      var last = i === g.length - 1;
      return '<div class="gate' + (last ? ' final' : '') + '"><span class="idx">' + (i + 1) + '</span><span>' + esc(x.title) + (last && cfg.approval_word ? ' — <span class="word">' + esc(cfg.approval_word) + '</span>' : '') + '</span><span class="status gs ' + cls + '">' + STATUS_ICON[cls] + esc(st === 'passed' ? 'Passed' : st === 'blocked' ? 'Blocked' : 'Open') + '</span></div>';
    }).join('') : '<div class="empty">No gates defined.</div>';

    var h = cfg.handoffs || [];
    $('hand-n').textContent = h.length + ' hops';
    $('handoffs').innerHTML = h.length ? h.map(function (x) {
      var a = seats[x.from], b = seats[x.to];
      return '<div class="hand"><span style="color:' + (a ? COLORS[a.color] : '#E7EAEE') + '">' + esc(a ? a.name : x.from) + '</span><span class="arrow">→ <span class="mono">' + esc(x.key) + '</span> →</span><span style="color:' + (b ? COLORS[b.color] : '#E7EAEE') + '">' + esc(b ? b.name : x.to) + '</span><span class="meta">timeout ' + esc(x.timeout) + ' · on failure: ' + esc(x.on_failure) + '</span></div>';
    }).join('') : '<div class="empty">No handoffs defined.</div>';
    applyMotion();
  }

  var motion = false;
  function applyMotion() {
    var cards = document.querySelectorAll('.seat-card');
    for (var i = 0; i < cards.length; i++) {
      var live = cards[i].getAttribute('data-status') === 'live';
      cards[i].classList.toggle('pulse', motion && live);
    }
  }
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._h); toast._h = setTimeout(function () { t.style.display = 'none'; }, 2200); }

  var current = null;
  try { var saved = localStorage.getItem('desk-board-config'); if (saved) { var c = JSON.parse(saved); if (!validate(c).length) current = c; } } catch (e) {}
  if (!current) current = PUBLISHED;
  if (current) render(current); else { $('m-mission').textContent = 'No config embedded. Use Load config to paste one.'; }

  $('btn-load').addEventListener('click', function () { $('cfg-text').value = JSON.stringify(current || PUBLISHED || {}, null, 2); $('cfg-msg').textContent = ''; $('drawer').setAttribute('open', ''); $('cfg-text').focus(); });
  $('btn-close').addEventListener('click', function () { $('drawer').removeAttribute('open'); });
  $('drawer').addEventListener('click', function (e) { if (e.target === $('drawer')) $('drawer').removeAttribute('open'); });
  $('btn-apply').addEventListener('click', function () {
    var cfg; try { cfg = JSON.parse($('cfg-text').value); } catch (e) { $('cfg-msg').textContent = 'Not valid JSON: ' + e.message; return; }
    var p = validate(cfg); if (p.length) { $('cfg-msg').textContent = p.join(' · '); return; }
    current = cfg; render(cfg); try { localStorage.setItem('desk-board-config', JSON.stringify(cfg)); } catch (e) {}
    $('drawer').removeAttribute('open'); toast('Config applied — this browser only');
  });
  $('btn-reset').addEventListener('click', function () { try { localStorage.removeItem('desk-board-config'); } catch (e) {} current = PUBLISHED; if (current) render(current); $('drawer').removeAttribute('open'); toast('Back to the published config'); });
  $('btn-motion').addEventListener('click', function () { motion = !motion; this.setAttribute('aria-pressed', String(motion)); applyMotion(); });
})();
</script>
