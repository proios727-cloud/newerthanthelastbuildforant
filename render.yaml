# Render Blueprint: one always-on background worker with a persistent disk.
# The nightly review runs inside this worker (it owns the disk), then publishes to the `reviews` branch.
services:
  - type: worker
    name: regime-bot
    runtime: python
    plan: starter            # persistent disks need a paid plan
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true         # question rewrites pushed to main redeploy the bot
    disk:
      name: bot-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BOT_STATE_DIR
        value: /var/data/state
      - key: GITHUB_REPO
        value: proios727-cloud/regime-bot
      - key: NACE_API_KEY        # full Drex key (not the masked preview)
        sync: false
      - key: GITHUB_TOKEN        # fine-grained PAT: Contents read/write on this repo only
        sync: false
      - key: BOT_NTFY_TOPIC      # private ntfy topic for phone pings
        sync: false
